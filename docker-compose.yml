services:
  db:
    image: postgres:16-alpine
    container_name: smart-kitchen-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_kitchen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - smart_kitchen_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_kitchen"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smart_kitchen_postgres_data:
